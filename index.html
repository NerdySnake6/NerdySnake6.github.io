          <div class="hero__contacts" id="hero-contacts">

            <a class="hero__contact" id="hero-contact-github" hidden>

            <a class="hero__contact" id="hero-contact-telegram" hidden>

              <span class="hero__contact-body">
                <span class="hero__contact-label">Местоположение</span>

              </span>
            </div>
          </div>
        </div>

        <div class="hero__highlights" id="hero-highlights"></div>
