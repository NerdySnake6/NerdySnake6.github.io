<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Игорь Калинин — специалист по Data Science и Big Data Analytics. Анализ данных, прогнозные модели, машинное обучение.">
  <meta name="author" content="Игорь Калинин">
  <meta property="og:title" content="Игорь Калинин — Data Science & Big Data Analytics">
  <meta property="og:description" content="Персональный сайт-резюме. Анализ данных, прогнозные модели, машинное обучение.">
  <meta property="og:type" content="website">
  <title>Игорь Калинин — Data Science & Big Data Analytics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ====== НАВИГАЦИЯ ====== -->
  <nav class="nav" id="nav">
    <div class="nav__inner">
      <a href="#" class="nav__logo" id="nav-logo"></a>
      <button class="nav__toggle" id="nav-toggle" aria-label="Открыть меню">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav__links" id="nav-links"></ul>
    </div>
  </nav>

  <!-- ====== HERO ====== -->
  <header class="hero" id="hero">
    <div class="hero__inner">
      <div class="hero__content">
        <p class="hero__greeting" id="hero-greeting"></p>
        <h1 class="hero__name" id="hero-name"></h1>
        <p class="hero__role" id="hero-role"></p>
        <p class="hero__tagline" id="hero-tagline"></p>
        <div class="hero__highlights" id="hero-highlights"></div>
      </div>
      <div class="hero__photo-wrapper">
        <div class="hero__photo" id="hero-photo">
          <span class="hero__photo-initials" id="hero-initials"></span>
        </div>
      </div>
    </div>
  </header>

  <main>
    <!-- ====== ОБО МНЕ ====== -->
    <section class="section" id="about">
      <div class="section__inner">
        <h2 class="section__title" id="about-title"></h2>
        <div class="section__content about__text" id="about-text"></div>
      </div>
    </section>

    <!-- ====== НАВЫКИ ====== -->
    <section class="section section--alt" id="skills">
      <div class="section__inner">
        <h2 class="section__title" id="skills-title"></h2>
        <div class="section__content skills__grid" id="skills-grid"></div>
      </div>
    </section>

    <!-- ====== ДОСТИЖЕНИЯ ====== -->
    <section class="section" id="achievements">
      <div class="section__inner">
        <h2 class="section__title" id="achievements-title"></h2>
        <div class="section__content achievements__list" id="achievements-list"></div>
      </div>
    </section>

    <!-- ====== ПРОЕКТЫ ====== -->
    <section class="section section--alt" id="projects">
      <div class="section__inner">
        <h2 class="section__title" id="projects-title"></h2>
        <div class="section__content projects__list" id="projects-list"></div>
      </div>
    </section>

    <!-- ====== СЕРТИФИКАТЫ ====== -->
    <section class="section" id="certificates">
      <div class="section__inner">
        <h2 class="section__title" id="certificates-title"></h2>
        <div class="section__content certificates__grid" id="certificates-grid"></div>
        <p class="certificates__empty" id="certificates-empty" style="display:none;">Раздел будет дополнен.</p>
      </div>
    </section>

    <!-- ====== КОНТАКТЫ ====== -->
    <section class="section section--contacts" id="contacts">
      <div class="section__inner">
        <h2 class="section__title" id="contacts-title"></h2>
        <div class="section__content contacts__content" id="contacts-content"></div>
      </div>
    </section>
  </main>

  <!-- ====== FOOTER ====== -->
  <footer class="footer">
    <div class="footer__inner">
      <p class="footer__copy" id="footer-copy"></p>
    </div>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
